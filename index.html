<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richawrites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B1B4E; --pink:#FF3D81; --sun:#FFC93C; --teal:#12B5A6; --sky:#4C7DFF;
  --wash:#F6F2FF; --white:#fff; --muted:#6B5F86;
  --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--white);line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #ece6fa}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:var(--serif);font-weight:800;font-size:1.35rem;text-decoration:none}
.logo span{color:var(--pink)}
nav a{margin-left:22px;text-decoration:none;font-weight:500}
nav a:hover{color:var(--pink)}

/* hero */
.hero{background:var(--wash);overflow:hidden;position:relative}
.hero .wrap{padding-top:70px;padding-bottom:80px;position:relative}
.hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(2.4rem,6.5vw,4.6rem);line-height:1.05;max-width:760px}
.hero p{max-width:520px;margin:20px 0 28px;color:var(--muted);font-size:1.1rem}
.btn{display:inline-block;background:var(--pink);color:#fff;padding:13px 26px;border-radius:999px;font-weight:700;text-decoration:none;border:0;cursor:pointer;font-size:1rem;font-family:inherit;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:var(--ink);margin-left:10px}
.blob{position:absolute;border-radius:50%;z-index:0}
.b1{width:300px;height:300px;background:var(--sun);right:-60px;top:-50px}
.b2{width:170px;height:170px;background:var(--teal);right:150px;bottom:-60px}
.b3{width:70px;height:70px;background:var(--pink);right:60px;bottom:90px}
.hero .wrap>*{position:relative;z-index:1}

/* sections */
section{padding:64px 0}
h2{font-family:var(--serif);font-weight:800;font-size:2.2rem;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:26px}

/* genre filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
.pill{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:7px 18px;border-radius:999px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.95rem}
.pill:hover{background:var(--wash)}
.pill.on{background:var(--ink);color:#fff}

/* article cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.card{background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;font-family:inherit;color:inherit;padding:0;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translate(-4px,-4px);box-shadow:6px 6px 0 var(--ink)}
.cover{height:170px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:14px}
.tag{background:#fff;color:var(--ink);font-weight:700;font-size:.8rem;padding:4px 12px;border-radius:999px}
.card .body{padding:18px 20px 22px}
.card h3{font-family:var(--serif);font-size:1.3rem;line-height:1.25;margin-bottom:8px}
.card p{color:var(--muted);font-size:.95rem}
.meta{font-size:.82rem;color:var(--muted);margin-top:12px}

/* reader */
.reader{position:fixed;inset:0;background:rgba(43,27,78,.6);display:none;z-index:50;overflow-y:auto;padding:30px 14px}
.reader.open{display:block}
.paper{background:#fff;max-width:720px;margin:0 auto;border-radius:24px;overflow:hidden}
.paper .cover{height:240px}
.paper .inner{padding:30px 34px 40px}
.paper h2{font-size:2.1rem;line-height:1.15}
.paper .meta{margin:6px 0 24px}
.paper .text p{margin-bottom:1.2em;font-family:var(--serif);font-weight:600;font-size:1.08rem;line-height:1.8;color:#3d2f60}
.paper .text img{max-width:100%;border-radius:14px;margin:8px 0 20px}
.paper .text h4{font-family:var(--serif);font-size:1.3rem;margin:24px 0 8px}
.close{float:right;margin:14px;background:#fff;border:2px solid var(--ink);border-radius:50%;width:42px;height:42px;font-size:1.2rem;cursor:pointer;position:relative;z-index:2}

/* podcast */
.pod{background:var(--ink);color:#fff}
.pod .sub{color:#c9bde8}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.ep{background:#3a2766;border-radius:20px;padding:22px}
.ep .ico{width:48px;height:48px;border-radius:14px;background:var(--sun);display:grid;place-items:center;font-size:1.5rem;margin-bottom:12px}
.ep h3{font-family:var(--serif);font-size:1.25rem;margin-bottom:6px}
.ep p{color:#c9bde8;font-size:.93rem;margin-bottom:14px}
.ep audio{width:100%}
.ep iframe{width:100%;border:0;border-radius:12px;min-height:152px}

/* about + footer */
.about .wrap{display:grid;grid-template-columns:200px 1fr;gap:34px;align-items:center}
.photo{width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--sun));background-size:cover;background-position:center;border:4px solid var(--ink)}
footer{background:var(--wash);padding:34px 0;text-align:center;color:var(--muted)}
footer a{color:var(--pink);font-weight:700;margin:0 8px}

@media(max-width:640px){
  nav a{margin-left:14px;font-size:.92rem}
  .about .wrap{grid-template-columns:1fr;text-align:center}
  .photo{margin:0 auto}
  .paper .inner{padding:24px 20px 32px}
  .btn.alt{margin:10px 0 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="logo" href="#top">Richa<span>writes</span></a>
    <nav><a href="#articles">Articles</a><a href="#podcast">Podcast</a><a href="#about">About</a></nav>
  </div>
</header>

<div class="hero" id="top">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="wrap">
    <h1 id="siteTitle"></h1>
    <p id="siteTagline"></p>
    <a class="btn" href="#articles">Read articles</a>
    <a class="btn alt" href="#podcast">Listen to the podcast</a>
  </div>
</div>

<section id="articles">
  <div class="wrap">
    <h2>Articles</h2>
    <p class="sub">Pick a genre or browse everything.</p>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="pod" id="podcast">
  <div class="wrap">
    <h2>Podcast</h2>
    <p class="sub">Press play, or open the episode on your favourite app.</p>
    <div class="eps" id="eps"></div>
  </div>
</section>

<section class="about" id="about">
  <div class="wrap">
    <div class="photo" id="photo"></div>
    <div>
      <h2>About me</h2>
      <p id="aboutText"></p>
    </div>
  </div>
</section>

<footer>
  <p id="footText"></p>
  <p style="margin-top:10px" id="links"></p>
</footer>

<div class="reader" id="reader" aria-modal="true" role="dialog">
  <div class="paper" id="paper"></div>
</div>

<script>
/* =====================================================================
   EDIT ONLY THIS SECTION (SITE DATA). Everything below it is the engine.
   ===================================================================== */

/* 1. SITE DETAILS */
const SITE = {
  name: "Richawrites",   // also change the <title> and logo at the top of the file
  title: "Stories, ideas and everyday wonders.",
  tagline: "Essays, parenting notes, travel diaries and book thoughts, written with a cup of chai in hand.",
  about: "Hi, I am Richa, a freelance writer who loves turning small moments into words. Write a few lines about yourself here, what you write about and why.",
  photo: "",               // e.g. "images/me.jpg" (leave empty for a colourful circle)
  footer: "© 2026 Richawrites. All rights reserved.",
  links: [                 // add or remove social links
    { label: "Instagram", url: "https://instagram.com/" },
    { label: "LinkedIn",  url: "https://linkedin.com/" },
    { label: "Email",     url: "mailto:you@example.com" }
  ]
};

/* 2. GENRE COLOURS: add a new genre here and give it a colour */
const GENRES = {
  "Parenting":   "#FF3D81",
  "Travel":      "#12B5A6",
  "Education":   "#4C7DFF",
  "Lifestyle":   "#FF8A3D",
  "Book Review": "#8B5CF6"
};

/* 3. ARTICLES: copy one block, paste it at the TOP, and change the text.
      image: put a picture path like "images/chai.jpg" or a web link. Leave "" for a colour cover.
      body:  write paragraphs inside <p>...</p>. Add pictures with <img src="images/pic.jpg" alt="describe it">.
             Sub-headings use <h4>...</h4>. */
const ARTICLES = [
 {
    title: "Why Every Child Needs Ten Minutes of Boredom",
    genre: "Parenting",
    date: "19 Oct 2026",
    read: "4 min read",
    image: "images/watermarked_img_5513355757837925217.png",
    excerpt: "We rush to fill every free minute for our kids. Here is why a little empty time may be the best gift.",
    body: `<p>We live in an age of constant stimulation. From the moment our children wake up until it is time for lights out, their days are carefully curated and packed with activities. School, homework, tuition classes, art workshops, piano lessons, and structured playdates fill every available slot. As parents, we often do this out of love and a deep desire to give them the best possible head start in life. We worry that an idle child is a missed opportunity for learning.</p>
    <p>Yet, in our quest to keep them engaged, we might be robbing them of one of the most powerful catalysts for growth: boredom.</p>
    <h4>The Magic of the Empty Hour</h4>
    <p>When a child announces, "I am bored," what they are usually experiencing is a brief vacuum in external direction. For a moment, the television is off, the toys have lost their novelty, and there is no scheduled activity to rush off to.</p>
    <p>In that quiet discomfort lies the magic.</p>
    <p>Boredom is not an empty state; it is a pressurized space waiting to be filled. When adults stop stepping in to entertain, rescue, or organize, something remarkable happens: the child’s own imagination steps up to take the wheel.</p>
    <p>A simple cardboard box suddenly transforms into a spaceship. A pile of sofa cushions becomes a mountain range that must be summited. A few fallen leaves and twigs in the backyard turn into ingredients for a secret potion. Without the scaffolding of adult-led entertainment, children learn to look inward. They invent rules, negotiate roles with siblings, solve spatial puzzles, and test out creative ideas.</p>
    <h4>Building Resilience Through Stillness</h4>
    <p>Beyond creativity, unstructured time teaches emotional regulation and resilience. Constant entertainment teaches children that comfort comes from the outside. When they experience downtime, they learn how to sit with their own thoughts, manage restlessness, and discover that they don't need a screen or an organized event to feel content.</p>
    <p>This self-soothing ability is a vital life skill. Children who are constantly entertained often struggle when faced with unstructured environments later in life because they have never had to practice the art of self-initiation.</p>
    <h4>How to Give Them Ten Minutes</h4>
    <p>You don't need to completely overhaul your daily routine or abandon structured learning to let your children experience this. Start small. Give them just ten or fifteen minutes of unscripted, screen-free downtime every day.</p>
    <ul>
        <li><strong>Step back:</strong> Resist the immediate urge to offer suggestions when you hear "I'm bored." Smile gently and say, "I'm sure you'll figure out something wonderful to do."</li>
        <li><strong>Provide open-ended materials:</strong> Keep a basket of simple items nearby—paper, crayons, blocks, fabric scraps, or old boxes—rather than complex toys with a single function.</li>
        <li><strong>Embrace the mess:</strong> True creativity often looks a bit chaotic. Allow the floor to be covered in paper scraps or cushions for a little while.</li>
    </ul>
    <p>The next time your child looks up and sighs that there is nothing to do, take a deep breath and view it as a gift. That little sigh is simply the prelude to a new adventure born entirely from their own mind.</p>`
}
  },
  {
    title: "Three Quiet Days in the Hills",
    genre: "Travel",
    date: "02 Oct 2026",
    read: "6 min read",
    image: "",
    excerpt: "No itinerary, no alarms. What happened when I let the mountains set the pace.",
    body: `<p>Write your travel story here.</p><p>Tell readers what you saw, ate and felt.</p>`
  },
  {
    title: "Making Letters Fun: Ideas from the Classroom",
    genre: "Education",
    date: "21 Sep 2026",
    read: "5 min read",
    image: "",
    excerpt: "Simple, playful ways teachers and parents can help little ones fall in love with the alphabet.",
    body: `<p>Write your education article here.</p>`
  },
  {
    title: "The Slow Sunday Routine That Changed My Week",
    genre: "Lifestyle",
    date: "10 Sep 2026",
    read: "3 min read",
    image: "",
    excerpt: "One small ritual, a calmer Monday. Here is how it works.",
    body: `<p>Write your lifestyle article here.</p>`
  },
  {
    title: "A Book That Stayed With Me",
    genre: "Book Review",
    date: "28 Aug 2026",
    read: "4 min read",
    image: "",
    excerpt: "Thoughts on a story I finished weeks ago and still think about every day.",
    body: `<p>Write your book review here.</p>`
  }
];

/* 4. PODCAST EPISODES
      Option A (your own audio file):  audio: "audio/episode1.mp3"
      Option B (Spotify / YouTube embed): embed: "https://open.spotify.com/embed/episode/XXXX"
      Use one of the two per episode. */
const EPISODES = [
  {
    title: "Episode 1: Why I Started Writing",
    desc: "A friendly first chat about words, habits and finding your voice.",
    audio: "",   // e.g. "audio/episode1.mp3"
    embed: ""    // e.g. a Spotify or YouTube embed link
  },
  {
    title: "Episode 2: Writing Every Day",
    desc: "Small tricks to keep the pen moving, even on busy days.",
    audio: "",
    embed: ""
  }
];

/* =====================================================================
   ENGINE: you do not need to change anything below this line
   ===================================================================== */
const $ = id => document.getElementById(id);
let current = "All";

$("siteTitle").textContent = SITE.title;
$("siteTagline").textContent = SITE.tagline;
$("aboutText").textContent = SITE.about;
$("footText").textContent = SITE.footer;
if (SITE.photo) $("photo").style.backgroundImage = `url('${SITE.photo}')`;
$("links").innerHTML = SITE.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join("");

function coverStyle(a){
  const c = GENRES[a.genre] || "#2B1B4E";
  return a.image
    ? `background-image:url('${a.image}')`
    : `background-image:linear-gradient(135deg,${c},#FFC93C)`;
}

function drawFilters(){
  const names = ["All", ...Object.keys(GENRES)];
  $("filters").innerHTML = names.map(n =>
    `<button class="pill ${n===current?'on':''}" data-g="${n}">${n}</button>`).join("");
  $("filters").querySelectorAll(".pill").forEach(b =>
    b.onclick = () => { current = b.dataset.g; drawFilters(); drawCards(); });
}

function drawCards(){
  const list = ARTICLES.map((a,i)=>({a,i})).filter(x => current==="All" || x.a.genre===current);
  $("grid").innerHTML = list.length ? list.map(({a,i}) => `
    <button class="card" data-i="${i}">
      <div class="cover" style="${coverStyle(a)}"><span class="tag">${a.genre}</span></div>
      <div class="body">
        <h3>${a.title}</h3>
        <p>${a.excerpt}</p>
        <div class="meta">${a.date} &middot; ${a.read}</div>
      </div>
    </button>`).join("") : "<p>No articles in this genre yet. Check back soon.</p>";
  $("grid").querySelectorAll(".card").forEach(c => c.onclick = () => openArticle(+c.dataset.i));
}

function openArticle(i){
  const a = ARTICLES[i];
  $("paper").innerHTML = `
    <button class="close" aria-label="Close article">&times;</button>
    <div class="cover" style="${coverStyle(a)}"><span class="tag">${a.genre}</span></div>
    <div class="inner">
      <h2>${a.title}</h2>
      <div class="meta">${a.date} &middot; ${a.read}</div>
      <div class="text">${a.body}</div>
    </div>`;
  $("reader").classList.add("open");
  $("reader").scrollTop = 0;
  document.body.style.overflow = "hidden";
  $("paper").querySelector(".close").onclick = closeArticle;
}
function closeArticle(){ $("reader").classList.remove("open"); document.body.style.overflow = ""; }
$("reader").addEventListener("click", e => { if (e.target === $("reader")) closeArticle(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeArticle(); });

$("eps").innerHTML = EPISODES.map(e => `
  <div class="ep">
    <div class="ico">🎙️</div>
    <h3>${e.title}</h3>
    <p>${e.desc}</p>
    ${e.embed ? `<iframe src="${e.embed}" loading="lazy" allow="encrypted-media" title="${e.title}"></iframe>`
      : e.audio ? `<audio controls preload="none" src="${e.audio}"></audio>`
      : `<p><em>Add your audio file or embed link in the EPISODES section.</em></p>`}
  </div>`).join("");

drawFilters();
drawCards();
</script>
</body>
</html>
